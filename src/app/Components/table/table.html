<div class="table-wrapper mat-elevation-z3">
  @if (displayedColumns.length > 0) {
    <table mat-table [dataSource]="dataSource" class="mat-table-generic">
      <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
        <th mat-header-cell *matHeaderCellDef> {{ formatHeader(col) }} </th>
        <td mat-cell *matCellDef="let element"> {{ element[col] }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  } @else {
    <div class="empty-state">No hay registros disponibles para mostrar.</div>
  }
</div>
